[package]
name = "jj_release"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
description = "Core library for jj-release: semantic releases for jj-vcs"
documentation.workspace = true
categories.workspace = true
edition.workspace = true
exclude.workspace = true

[lib]
name = "jj_release"
path = "src/lib.rs"
doctest = false

[dependencies]
cargo_metadata = "0.23.1"
dirs = "7.0.0"
git-conventional = "1.1.0"
jiff = { version = "0.2.37", features = ["std"], default-features = false }
semver = { version = "1.0.28", default-features = false }
serde = { version = "1.0.229", features = ["derive"], default-features = false }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = { version = "1.1.6", features = [
  "parse",
  "serde",
], default-features = false }
toml_edit = "0.25.15"
ureq = { version = "3.4.2", features = [
  "json",
  "rustls",
], default-features = false }
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
