[package]
name = "jj_release_core"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
description = "Core library for jj-release: semantic releases for jj-vcs"
documentation.workspace = true
categories.workspace = true
edition.workspace = true
exclude.workspace = true

[lib]
name = "jj_release_core"
path = "src/lib.rs"
doctest = false

[dependencies]
cargo_metadata = "0.23.1"
dirs = "7.0.0"
git-conventional = "1.1.0"
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
regex = "1.13.1"
semver = { version = "1.0.28", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.151"
thiserror = { version = "2.0.21", default-features = false }
toml = { version = "1.1.6", features = [
  "parse",
  "serde",
], default-features = false }
toml_edit = "0.25.15"
ureq = { workspace = true }
which = "8.0.6"

[dev-dependencies]
tempfile = { version = "3.27.0", default-features = false }

[lints]
workspace = true

[features]
default = ["github", "gitlab", "gitea"]
github = []
gitlab = []
gitea = []
forgejo = ["gitea"]
full = ["github", "gitlab", "gitea", "forgejo"]
