[workspace]
members = ["lib", "cli"]
default-members = ["lib", "cli"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
authors = ["T. Sawyer <saylesss87@proton.me>"]
description = "Semantic releases for Jujutsu VCS repositories"
documentation = "https://docs.rs/jj-release"
license = "Apache-2.0"
repository = "https://github.com/saylesss88/jj-release"
keywords = ["jujutsu", "release", "semantic-release", "changelog", "ci"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github", "tests/", "assets/"]

[workspace.dependencies]
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "json",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"
# missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
todo = "warn"
dbg_macro = "warn"
