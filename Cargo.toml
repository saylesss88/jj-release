[package]
name = "jj-release"
version = "0.4.0"
edition = "2024"
description = "Semantic releases for Jujutsu VCS repositories"
license = "Apache-2.0"
repository = "https://github.com/saylesss88/jj-release"
keywords = ["jujutsu", "release", "semantic-release", "changelog", "ci"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github"]

[dependencies]
anyhow = { version = "1.0.104", default-features = false }
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", default-features = false, features = [
  "derive",
  "std",
] }
dirs = "7.0.0"
git-conventional = "1.1.0"
jiff = { version = "0.2.37", features = ["std"], default-features = false }
semver = { version = "1.0.28", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.151"
toml = { version = "1.1.6", features = [
  "parse",
  "serde",
], default-features = false }
toml_edit = "0.25.15"
ureq = { version = "3.4.2", features = [
  "_tls",
  "json",
], default-features = false }
which = "8.0.6"

[dev-dependencies]
tempfile = { version = "3", default-features = false }

[lib]
name = "jj_release"
path = "src/lib.rs"

[[bin]]
name = "jj-release"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false

[lints.rust]
unsafe_code = "forbid"
# missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
todo = "warn"
dbg_macro = "warn"
