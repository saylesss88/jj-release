[package]
name = "jj-release"
version = "0.1.0"
edition = "2024"
description = "Semantic releases for Jujutsu VCS repositories"
license = "Apache-2.0"
repository = "https://github.com/saylesss88/jj-release"
readme = "README.md"
keywords = ["jujutsu", "release", "semantic-release", "changelog", "ci"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github"]

[dependencies]
anyhow = "1.0.104"
clap = {version = "4.6.6", default-features = false, features = [
	"derive",
	"std",
]}
git-conventional = "1.1.0"
jiff = "0.2.35"
semver = "1.0.28"
serde = {version = "1.0.229", default-features = false, features = ["derive"]}
serde_json = {version = "1.0.151", default-features = false, features = ["std"]}
thiserror = "2.0.20"
toml = "1.1.5"
toml_edit = "0.25.13"
ureq = { version = "3.4.1", features = ["json"] }
which = "8.0.6"

[dev-dependencies]
tempfile = "3"

[lib]
name = "jj_release"
path = "src/lib.rs"

[[bin]]
name = "jj-release"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false

[lints.rust]
unsafe_code = "forbid"
# missing_docs = "warn"
rust_2018_idioms = {level = "warn", priority = -1}
future_incompatible = {level = "warn", priority = -1}
nonstandard_style = {level = "warn", priority = -1}

[lints.clippy]
all = {level = "warn", priority = -1}
pedantic = {level = "warn", priority = -1}
module_name_repetitions = "allow"
must_use_candidate = "allow"
todo = "warn"
dbg_macro = "warn"
