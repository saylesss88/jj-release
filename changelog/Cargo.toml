[package]
name = "jj_release_changelog"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Keep a Changelog rendering from Conventional Commits"
documentation.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[dependencies]
git-conventional = "1.1.0"
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
semver = { version = "1.0.28", default-features = false }
serde = { version = "1.0.229", features = ["derive"], optional = true }

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde"]
