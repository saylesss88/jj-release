# Generated by jj-release

[release]
forge = "github"
create_release = false

[publish]
cargo = false

[changelog]
enabled = true
strict = true
emoji_headers = true
# exclude_prefixes = ["chore", "ci", "test"]

# [publish.aur]
# package = "my-package"
# required = false

# [publish.copr]
# Required: your COPR project as owner/project
# project = "your-username/my-cli-tool"
# required = false

# Required: path to the spec, relative to the repo root
# spec = "packaging/rust-my-cli-tool.spec"

# Optional: wait for the COPR build to finish (default: false)
# wait = true

manifest_backend = "cargo"

[workspace]
enabled = true
versioning = "unified"

[[workspace.members]]
name = "jj_release_core"
path = "lib"
publish = true
# depends_on = []

[[workspace.members]]
name = "jj-release"
path = "cli"
publish = true
# depends_on = []
