# Generated by jj-release

manifest_backend = "cargo"

[release]
forge = "github"
create_release = false

[publish]
cargo = false

[changelog]
enabled = true
strict = true
# emoji_headers = true
# link_headers = true
# layout = "per-member"  # "root" (default) or "both"
# exclude_prefixes = ["chore", "ci", "test"]

# [changelog.prefix_mapping]
# security = "Security"
# doc = "Documentation"

# [[replacements]]
# file = "README.md"
# search = 'your-crate = ".*"'
# replace = 'your-crate = "{{version}}"'

# [publish.aur]
# package = "my-package"
# fail_on_error = false

# [publish.copr]
# Required: your COPR project as owner/project
# project = "your-username/my-cli-tool"
# fail_on_error = false

# Required: path to the spec, relative to the repo root
# spec = "packaging/rust-my-cli-tool.spec"

# Optional: wait for the COPR build to finish (default: false)
# wait = true

[workspace]
enabled = true
versioning = "unified"

[[workspace.members]]
name = "jj_release_core"
path = "lib"
depends_on = ["jj_release_changelog"]

[[workspace.members]]
name = "jj_release_changelog"
path = "changelog"

[[workspace.members]]
name = "jj-release"
path = "cli"
depends_on = ["jj_release_changelog", "jj_release_core"]
