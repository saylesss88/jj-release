# Generated by jj-release

[release]
forge = "github"
create_release = true

[publish]
cargo = false

[changelog]
enabled = true
strict = true
emoji_headers = true
# exclude_prefixes = ["chore", "ci", "test"]
link_headers = true

[publish.aur]
package = "jj-release"
# required = false

[publish.copr]
# Required: your COPR project as owner/project
# project = "your-username/my-cli-tool"
# required = false

# Required: path to the spec, relative to the repo root
spec = "copr/rust-jj-release.spec"

# Optional: wait for the COPR build to finish (default: false)
# wait = true


[workspace]
enabled = true
versioning = "unified"

[[workspace.members]]
name = "jj_release_core"
path = "lib"
publish = true
# depends_on = []

[[workspace.members]]
name = "jj-release"
path = "cli"
publish = true
depends_on = ["jj_release_core"]


manifest_backend = "cargo"
