# Generated by jj-release init

[release]
forge = "github"
create_release = false

[publish]
cargo = true

[changelog]
enabled = true
emoji_headers = true

manifest_backend = "cargo"

[workspace]
enabled = true
versioning = "unified"

[[workspace.members]]
name = "jj_release_core"
path = "lib"
publish = true
# depends_on = [] # add names of members this depends on

[[workspace.members]]
name = "jj-release"
path = "cli"
publish = true
depends_on = ["jj_release_core"] # add names of members this depends on
